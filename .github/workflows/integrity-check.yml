name: Integrity check

on: [push, pull_request]

jobs:

  build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.13.3"
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: "24"
        cache: npm

    - name: Install dependencies
      run: |
        uv sync --locked --group export
        npm ci --ignore-scripts

    - name: Check Python and web tooling
      run: |
        uv run --locked ruff check .
        uv run --locked ruff format --check .
        npm run check

    - name: Validate flag helper compatibility
      run: uv run --locked python utils/flag_similarity.py --no-colour '#a00' '#f00'

    - name: Validate regular & extended decks
      run: |
        uv run --locked python utils/generate_and_build.py recipes/source_to_anki.yaml

    - name: Validate experimental deck
      run: |
        uv run --locked python utils/generate_and_build.py 'recipes/source_to_anki_[experimental].yaml'

    - name: Validate RU and EN source integrity and attribution
      run: uv run --locked python utils/verify_sources.py

    - name: Export public APKG packages
      run: uv run --locked --group export python utils/export_apkg.py

    - name: Validate packaging, UTF-8 handling and public imports
      run: uv run --locked --group export python -m unittest discover -s utils -p 'test_*.py' -v
