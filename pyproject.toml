[project]
name = "ultimate-geography"
version = "2026.10.25"
description = "Editable multilingual geography decks for Anki"
requires-python = ">=3.10,<3.16"
dependencies = [
    "brain-brew==0.3.11",
]

[dependency-groups]
dev = ["ruff==0.17.1"]
export = ["anki==26.9.3"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["utils/**/*.py", "pyproject.toml"]
extend-exclude = ["build", "vendor", "src/media", "src/note_models/templates/generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
